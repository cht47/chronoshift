<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>ChronoShift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Pico CSS v2.0.6, bundled instead of a CDN: works offline and sends no data to third parties -->
  <link rel="stylesheet" href="pico.min.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#13171f" />

  <!-- Set the theme before the first render, otherwise the wrong theme flashes briefly -->
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem("chronoshift.settings") || "{}").theme || "system";
      if (theme === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { }
  </script>

  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <p class="app-name">ChronoShift</p>
      <div class="view-title-row">
        <button type="button" class="icon-btn header-back" id="headerBackBtn" data-icon="chevronLeft"
          data-i18n-aria="common.back" hidden></button>
        <h1 class="view-title" id="viewTitle"></h1>
      </div>
      <!-- Reminder of a work time entry with an open end; a tap opens the entry -->
      <button type="button" class="open-banner" id="openBanner" hidden></button>
      <!-- Rest period banner, depending on the settings and the time window -->
      <div id="restBanner" role="status" hidden></div>
    </div>
  </header>

  <main class="app-main">
    <!-- ===================== Track time (tasks) ===================== -->
    <section id="view-tasks">
      <div class="card timer-card">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="timer-sub" id="timerSub"></div>
        <input type="text" id="taskInput" data-i18n-placeholder="tasks.placeholder" data-i18n-aria="tasks.placeholder"
          autocomplete="off" enterkeyhint="go" />
        <button id="startStopBtn"></button>
      </div>

      <div class="section-label"><span data-i18n="tasks.listTitle"></span><span id="taskListHint"></span></div>
      <div id="tasksContainer"></div>
    </section>

    <!-- ===================== Work time ===================== -->
    <section id="view-worktime" hidden>
      <div class="segmented entry-mode" role="group" id="entryModeSwitch" data-i18n-aria="worktime.modeAria">
        <button type="button" data-mode="work" aria-pressed="true" data-i18n="worktime.modeWork"></button>
        <button type="button" data-mode="absence" aria-pressed="false" data-i18n="worktime.modeAbsence"></button>
      </div>

      <form id="worktimeForm" class="card">
        <div class="form-title" id="wtFormTitle"></div>
        <label><span data-i18n="worktime.date"></span>
          <input type="date" id="wtDate" required />
        </label>
        <div class="two-col">
          <label><span data-i18n="worktime.start"></span>
            <input type="time" id="wtStart" required />
          </label>
          <label><span data-i18n="worktime.end"></span>
            <input type="time" id="wtEnd" />
          </label>
        </div>
        <div class="two-col">
          <label><span data-i18n="worktime.breakFrom"></span>
            <input type="time" id="wtBreakStart" />
          </label>
          <label><span data-i18n="worktime.breakTo"></span>
            <input type="time" id="wtBreakEnd" />
          </label>
        </div>
        <small class="hint" data-i18n="worktime.endOpenHint"></small>
        <small class="hint gap-top" data-i18n="worktime.breakHint"></small>
        <div class="form-actions">
          <button type="button" id="wtCancelBtn" class="secondary" data-i18n="common.cancel" hidden></button>
          <button type="submit" id="wtSaveBtn"></button>
        </div>
      </form>

      <form id="absenceForm" class="card" hidden>
        <div class="form-title" id="abFormTitle"></div>
        <label><span data-i18n="absence.type"></span>
          <select id="abType"></select>
        </label>
        <label><span id="abFromLabel"></span>
          <input type="date" id="abFrom" required />
        </label>
        <label id="abToWrap"><span data-i18n="absence.to"></span>
          <input type="date" id="abTo" />
        </label>
        <small class="hint" data-i18n="absence.hint"></small>
        <div class="form-actions">
          <button type="button" id="abCancelBtn" class="secondary" data-i18n="common.cancel" hidden></button>
          <button type="submit" id="abSaveBtn"></button>
        </div>
      </form>

      <div class="card">
        <div class="stat-label"><span data-i18n="worktime.thisWeek"></span> · <span id="weekRange"></span></div>
        <div class="stat-row">
          <div><span class="stat-value" id="weekActual"></span> <span class="stat-sub" id="weekTarget"></span></div>
          <span class="chip" id="weekDelta"></span>
        </div>
        <!-- Week progress: work time and absences as two segments; the numbers are shown above -->
        <div class="week-bar" aria-hidden="true">
          <span class="week-bar-work" id="weekBarWork"></span><span class="week-bar-absence" id="weekBarAbsence"></span>
        </div>
        <div class="balance-line" id="balanceLine" hidden></div>
        <div class="rest-line" id="restInfo" role="status" hidden></div>
      </div>

      <div class="section-label"><span data-i18n="worktime.entries"></span><span id="workListHint"></span></div>
      <div id="worktimeContainer"></div>
    </section>

    <!-- ===================== Calendar ===================== -->
    <section id="view-calendar" hidden>
      <div class="card">
        <div class="cal-head">
          <button type="button" class="icon-btn" id="calPrevBtn" data-i18n-aria="calendar.prev" data-icon="chevronLeft"></button>
          <span class="cal-title" id="calLabel"></span>
          <button type="button" class="icon-btn" id="calNextBtn" data-i18n-aria="calendar.next" data-icon="chevronRight"></button>
        </div>
        <div class="cal-grid" id="calWeekdays"></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="legend">
          <span><span class="dot task"></span> <span data-i18n="common.task"></span></span>
          <span><span class="dot work"></span> <span data-i18n="common.worktime"></span></span>
          <span><span class="dot error"></span> <span data-i18n="calendar.error"></span></span>
          <span><span class="dot absence"></span> <span data-i18n="calendar.absence"></span></span>
        </div>
        <div class="month-summary" id="calMonthSummary"></div>
      </div>
      <div id="calDayDetail"></div>
    </section>

    <!-- ===================== Settings ===================== -->
    <section id="view-settings" hidden>
      <!-- Overview: one row per area with its current value; the settings themselves are on sub-pages -->
      <div class="settings-home" id="settingsHome">
        <!-- Only visible while the app is not installed and the browser offers an installation -->
        <div id="installSection" hidden>
          <div class="list-group">
            <button type="button" class="action-row accent" id="installBtn"><span data-icon="smartphone"></span><span>
                <span data-i18n="settings.install"></span>
                <small class="hint" data-i18n="settings.installHint"></small>
              </span></button>
          </div>
        </div>

        <div class="section-label first"><span data-i18n="settings.appearance"></span></div>
        <div class="card">
          <div class="segmented" role="group" data-i18n-aria="settings.theme" id="themeSwitch">
            <button type="button" data-theme-value="system" data-i18n="settings.themeSystem"></button>
            <button type="button" data-theme-value="light" data-i18n="settings.themeLight"></button>
            <button type="button" data-theme-value="dark" data-i18n="settings.themeDark"></button>
          </div>
          <label class="gap-top"><span data-i18n="settings.language"></span>
            <select id="setLanguage"></select>
          </label>
        </div>
        <div class="list-group">
          <button type="button" class="action-row nav-row" data-page="lists"><span data-icon="list"></span><span
              class="nav-row-label" data-i18n="settings.lists"></span><span class="nav-row-value" id="sumLists"></span><span
              class="nav-row-chevron" data-icon="chevronRight"></span></button>
        </div>

        <div class="section-label"><span data-i18n="settings.groupTimes"></span></div>
        <div class="list-group">
          <button type="button" class="action-row nav-row" data-page="worktime"><span data-icon="briefcase"></span><span
              class="nav-row-label" data-i18n="settings.worktime"></span><span class="nav-row-value" id="sumWorktime"></span><span
              class="nav-row-chevron" data-icon="chevronRight"></span></button>
          <button type="button" class="action-row nav-row" data-page="rest"><span data-icon="hourglass"></span><span
              class="nav-row-label" data-i18n="settings.rest"></span><span class="nav-row-value" id="sumRest"></span><span
              class="nav-row-chevron" data-icon="chevronRight"></span></button>
        </div>

        <div class="section-label"><span data-i18n="settings.groupData"></span></div>
        <div class="list-group">
          <button type="button" class="action-row nav-row" data-page="backup"><span data-icon="save"></span><span
              class="nav-row-label" data-i18n="settings.backupPage"></span><span class="nav-row-value" id="sumBackup"></span><span
              class="nav-row-chevron" data-icon="chevronRight"></span></button>
          <button type="button" class="action-row nav-row" data-page="data"><span data-icon="download"></span><span
              class="nav-row-label" data-i18n="settings.dataPage"></span><span class="nav-row-value" id="sumData"></span><span
              class="nav-row-chevron" data-icon="chevronRight"></span></button>
        </div>

        <div class="app-footer">
          <div>© <span id="copyrightYears"></span> Daniel Herbst · <a href="https://github.com/cht47/chronoshift/blob/main/LICENSE"
              target="_blank" rel="noopener">MIT + Commons Clause</a></div>
          <div><span id="appVersion"></span> · <a href="https://github.com/cht47/chronoshift" target="_blank"
              rel="noopener">GitHub</a> · <a href="privacy.html" target="_blank" rel="noopener"
              data-i18n="settings.privacy"></a></div>
        </div>
      </div>

      <!-- Sub-page: lists -->
      <div class="settings-page" id="settingsPage-lists" hidden>
        <div class="section-label first"><span data-i18n="nav.tasks"></span></div>
        <div class="card">
          <div class="field-label" id="taskListLabel" data-i18n="settings.taskListCount"></div>
          <div class="segmented list-limit" role="group" aria-labelledby="taskListLabel" id="taskListSwitch"></div>
          <small class="hint" data-i18n="settings.taskListHint"></small>
        </div>

        <div class="section-label"><span data-i18n="nav.worktime"></span></div>
        <div class="card">
          <div class="field-label" id="workListLabel" data-i18n="settings.workListDays"></div>
          <div class="segmented list-limit" role="group" aria-labelledby="workListLabel" id="workListSwitch"></div>
          <small class="hint" data-i18n="settings.workListHint"></small>
        </div>
      </div>

      <!-- Sub-page: work time -->
      <div class="settings-page" id="settingsPage-worktime" hidden>
        <div class="section-label first"><span data-i18n="settings.target"></span></div>
        <div class="card">
          <label><span data-i18n="settings.weeklyHours"></span>
            <input type="number" id="setWeeklyHours" min="1" max="80" step="0.5" inputmode="decimal" />
          </label>
          <!-- No label element: a click on the text would trigger the first button -->
          <div class="field-label" id="workDaysLabel" data-i18n="settings.workDays"></div>
          <div class="segmented weekdays" role="group" aria-labelledby="workDaysLabel" id="workDaysSwitch"></div>
          <small class="hint" id="dailyTargetInfo"></small>
        </div>

        <div class="section-label"><span data-i18n="settings.breaks"></span></div>
        <div class="card">
          <label>
            <input type="checkbox" id="setAutoBreak" role="switch" />
            <span data-i18n="settings.breaksAuto"></span>
          </label>
          <div id="breakRulesWrap">
            <small class="hint gap-bottom" data-i18n="settings.breaksHint"></small>
            <div id="breakRulesContainer"></div>
            <button type="button" id="addBreakRuleBtn" class="secondary outline" data-i18n="settings.ruleAdd"></button>
          </div>
        </div>

        <div class="section-label"><span data-i18n="settings.balance"></span></div>
        <div class="card">
          <label>
            <input type="checkbox" id="setOvertime" role="switch" />
            <span data-i18n="settings.balanceEnable"></span>
          </label>
          <!-- Date and balance are changed rarely, so only in a dialog with an explicit save -->
          <div id="overtimeWrap">
            <div class="overtime-state">
              <span id="overtimeState"></span>
              <button type="button" class="secondary outline" id="overtimeEditBtn"></button>
            </div>
            <small class="hint" data-i18n="settings.balanceHint"></small>
          </div>
        </div>
      </div>

      <!-- Sub-page: rest period -->
      <div class="settings-page" id="settingsPage-rest" hidden>
        <div class="card">
          <label>
            <input type="checkbox" id="setRestEnabled" role="switch" />
            <span data-i18n="settings.restShow"></span>
          </label>
          <div id="restOptionsWrap">
            <label><span data-i18n="settings.restHours"></span>
              <input type="number" id="setRestHours" min="1" max="24" step="0.5" inputmode="decimal" />
            </label>
            <small class="hint input-hint" data-i18n="settings.restHoursHint"></small>
            <label>
              <input type="checkbox" id="setRestBanner" role="switch" />
              <span data-i18n="settings.restBanner"></span>
            </label>
            <div id="bannerWindowWrap">
              <div class="two-col">
                <label><span data-i18n="settings.bannerFrom"></span>
                  <input type="time" id="setBannerFrom" />
                </label>
                <label><span data-i18n="settings.bannerTo"></span>
                  <input type="time" id="setBannerTo" />
                </label>
              </div>
              <small class="hint" data-i18n="settings.bannerHint"></small>
            </div>
          </div>
          <small class="hint gap-top" id="restHint" data-i18n="settings.restHint"></small>
        </div>
      </div>

      <!-- Sub-page: backup -->
      <div class="settings-page" id="settingsPage-backup" hidden>
        <div class="section-label first"><span data-i18n="backup.localTitle"></span></div>
        <div class="list-group">
          <button type="button" class="action-row" id="backupCreateBtn"><span data-icon="save"></span><span
              data-i18n="backup.create"></span></button>
          <button type="button" class="action-row" id="backupRestoreBtn"><span data-icon="upload"></span><span
              data-i18n="backup.restore"></span></button>
        </div>
        <p class="hint list-note" id="backupInfo"></p>
        <!-- No accept filter: some Android file pickers do not recognize .json and would grey out the file -->
        <input type="file" id="backupFileInput" hidden />

        <div class="section-label"><span data-i18n="backup.cloudTitle"></span></div>
        <div class="card">
          <label>
            <input type="checkbox" id="setGdrive" role="switch" />
            <span data-i18n="backup.gdriveEnable"></span>
          </label>
          <small class="hint" data-i18n="backup.gdriveHint"></small>
          <small class="hint gap-top"><span data-i18n="backup.gdrivePrivacy"></span>
            <a href="https://policies.google.com/privacy" target="_blank" rel="noopener"
              data-i18n="backup.gdrivePrivacyLink"></a></small>
        </div>
        <div id="gdriveActions" hidden>
          <div class="list-group">
            <button type="button" class="action-row" id="gdriveSaveBtn"><span data-icon="cloudUpload"></span><span
                data-i18n="backup.cloudSave"></span></button>
            <button type="button" class="action-row" id="gdriveRestoreBtn"><span data-icon="cloudDownload"></span><span
                data-i18n="backup.cloudRestore"></span></button>
            <button type="button" class="action-row danger" id="gdriveDeleteBtn"><span data-icon="trash"></span><span
                data-i18n="backup.cloudDelete"></span></button>
          </div>
          <p class="hint list-note" id="gdriveInfo"></p>
        </div>
      </div>

      <!-- Sub-page: export & delete -->
      <div class="settings-page" id="settingsPage-data" hidden>
        <div class="section-label first"><span data-i18n="settings.export"></span></div>
        <div class="list-group">
          <button type="button" class="action-row" id="exportTasksBtn"><span data-icon="download"></span><span
              data-i18n="settings.exportTasks"></span></button>
          <button type="button" class="action-row" id="exportWorkBtn"><span data-icon="download"></span><span
              data-i18n="settings.exportWork"></span></button>
        </div>

        <div class="section-label"><span data-i18n="settings.delete"></span></div>
        <div class="card" id="deleteBeforeCard">
          <div class="form-title" data-i18n="settings.deleteBefore"></div>
          <label><span data-i18n="data.deleteBeforeDate"></span>
            <input type="date" id="deleteBeforeDate" />
          </label>
          <fieldset class="delete-scope">
            <label><input type="checkbox" role="switch" data-scope="tasks" /> <span data-i18n="data.scopeTasks"></span></label>
            <label><input type="checkbox" role="switch" data-scope="work" /> <span data-i18n="data.scopeWork"></span></label>
            <label><input type="checkbox" role="switch" data-scope="absences" /> <span data-i18n="data.scopeAbsences"></span></label>
          </fieldset>
          <p class="hint delete-summary" id="deleteBeforeSummary"></p>
          <div class="form-actions">
            <button type="button" class="btn-danger" id="deleteBeforeConfirmBtn" data-i18n="common.delete"></button>
          </div>
        </div>
        <div class="list-group">
          <button type="button" class="action-row danger" id="resetAllBtn"><span data-icon="alert"></span><span
              data-i18n="settings.resetAll"></span></button>
        </div>
        <p class="hint list-note" id="storageInfo"></p>
      </div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" data-i18n-aria="nav.label">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-item" id="tab-tasks" data-view="tasks">
        <span class="nav-icon" data-icon="timer"></span><span data-i18n="nav.tasks"></span>
      </button>
      <button type="button" class="nav-item" id="tab-worktime" data-view="worktime">
        <span class="nav-icon" data-icon="briefcase"></span><span data-i18n="nav.worktime"></span>
      </button>
      <button type="button" class="nav-item" id="tab-calendar" data-view="calendar">
        <span class="nav-icon" data-icon="calendar"></span><span data-i18n="nav.calendar"></span>
      </button>
      <button type="button" class="nav-item" id="tab-settings" data-view="settings">
        <span class="nav-icon" data-icon="settings"></span><span data-i18n="nav.settings"></span>
      </button>
    </div>
  </nav>

  <!-- Short feedback message that hides itself -->
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Dialog: general notice -->
  <dialog id="infoModal">
    <article>
      <header>
        <h3 data-i18n="common.notice"></h3>
      </header>
      <p id="infoModalText"></p>
      <footer>
        <button class="secondary" id="infoModalOkBtn" data-i18n="common.ok"></button>
      </footer>
    </article>
  </dialog>

  <!-- Dialog: backup reminder at startup -->
  <dialog id="backupReminderModal">
    <article>
      <header>
        <span class="dialog-icon warn" data-icon="alert"></span>
        <h3 data-i18n="backup.reminderTitle"></h3>
      </header>
      <p id="backupReminderText"></p>
      <footer>
        <button class="secondary" id="backupReminderLaterBtn" data-i18n="backup.reminderLater"></button>
        <button id="backupReminderSaveBtn" data-i18n="backup.reminderSave"></button>
      </footer>
    </article>
  </dialog>

  <!-- Dialog: choose a cloud backup -->
  <dialog id="cloudRestoreModal">
    <article>
      <header>
        <h3 data-i18n="backup.cloudRestore"></h3>
      </header>
      <p data-i18n="backup.cloudChoose"></p>
      <div class="list-group dialog-list" id="cloudRestoreList"></div>
      <footer>
        <button class="secondary" id="cloudRestoreCancelBtn" data-i18n="common.cancel"></button>
      </footer>
    </article>
  </dialog>

  <!-- Dialog: set up or change the overtime account -->
  <dialog id="overtimeModal">
    <article class="form-dialog">
      <header>
        <h3 data-i18n="settings.balance"></h3>
      </header>
      <label><span data-i18n="settings.balanceDate"></span>
        <input type="date" id="overtimeDateInput" />
      </label>
      <div class="field-label" id="overtimeValueLabel" data-i18n="settings.balanceValue"></div>
      <div class="balance-input" role="group" aria-labelledby="overtimeValueLabel">
        <div class="segmented balance-sign" role="group" data-i18n-aria="settings.balanceSignAria" id="overtimeSign">
          <button type="button" data-sign="1">+</button>
          <button type="button" data-sign="-1">−</button>
        </div>
        <input type="number" id="overtimeHours" min="0" max="9999" step="1" inputmode="numeric"
          data-i18n-aria="settings.balanceHoursAria" />
        <span>h</span>
        <input type="number" id="overtimeMinutes" min="0" max="59" step="1" inputmode="numeric"
          data-i18n-aria="settings.balanceMinutesAria" />
        <span>min</span>
      </div>
      <p class="hint" data-i18n="settings.balanceModalHint"></p>
      <footer>
        <button class="secondary" id="overtimeCancelBtn" data-i18n="common.cancel"></button>
        <button id="overtimeSaveBtn" data-i18n="common.save"></button>
      </footer>
    </article>
  </dialog>

  <!-- Dialog: confirmation (optionally with countdown) -->
  <dialog id="confirmModal">
    <article>
      <header>
        <h3 data-i18n="common.confirm"></h3>
      </header>
      <p id="confirmText"></p>
      <footer>
        <button class="secondary" id="confirmNoBtn" data-i18n="common.cancel"></button>
        <button id="confirmYesBtn" class="btn-danger"></button>
      </footer>
    </article>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>

</html>
