<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="120" y1="400" x2="330" y2="100">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#22c3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#22c3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="205" fill="url(#glow)"/>
  <!-- Ring als Pfeil im Uhrzeigersinn: steht für "Shift" -->
  <path d="M 342 133.1 A 150 150 0 1 1 163.6 137.8" fill="none" stroke="url(#ring)" stroke-width="36" stroke-linecap="round"/>
  <path d="M 206 108 L 140.2 107.9 L 187 167.7 Z" fill="url(#ring)" stroke="url(#ring)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Zeiger -->
  <line x1="256" y1="256" x2="256" y2="168" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="316" y2="291" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="18" fill="#22c3ff"/>
</svg>
